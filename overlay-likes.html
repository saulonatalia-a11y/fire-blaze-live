<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta de Likes</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#fff}.wrap{position:fixed;left:50%;bottom:55px;transform:translateX(-50%);width:min(820px,88vw)}.card{position:relative;padding:20px 28px;border:4px solid #f5f5f5;border-radius:24px;background:linear-gradient(150deg,rgba(14,25,49,.96),rgba(6,11,23,.96));box-shadow:0 0 0 6px #d93632,0 0 0 9px #151515,0 0 35px #2d80ff88;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.label{font-size:17px;font-weight:1000;letter-spacing:2px;color:#ffd84d;text-shadow:0 2px #2452a4}.nums{font-size:25px;font-weight:1000}.bar{height:18px;margin-top:15px;border:3px solid #111;border-radius:20px;background:#eef3ff;overflow:hidden}.fill{height:100%;width:50%;background:linear-gradient(90deg,#e53935,#ffd84d,#3688ff);transition:.5s}.ball{width:38px;height:38px;border-radius:50%;background:linear-gradient(#e53935 0 44%,#111 44% 56%,#fff 56%);border:3px solid #111;position:relative;flex:0 0 auto}.ball:after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid #111;left:50%;top:50%;transform:translate(-50%,-50%)}.left{display:flex;align-items:center;gap:12px}.spark{position:absolute;right:-30px;top:-50px;width:160px;height:160px;border-radius:50%;background:#3488ff22;filter:blur(8px)}</style></head><body><div class="wrap"><div class="card"><div class="spark"></div><div class="top"><div class="left"><div class="ball"></div><div class="label">♥ META DE LIKES</div></div><div class="nums"><span id="current">50</span> / <span id="target">100</span></div></div><div class="bar"><div class="fill" id="fill"></div></div></div></div>
<script>
const KEY='fireBlazeGoal'; function apply(d){if(!d||d.type!=='likes')return;const c=Math.max(0,Number(d.current)||0),t=Math.max(1,Number(d.target)||1);document.getElementById('current').textContent=c.toLocaleString('pt-BR');document.getElementById('target').textContent=t.toLocaleString('pt-BR');document.getElementById('fill').style.width=Math.min(100,c/t*100)+'%'}window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)try{apply(JSON.parse(e.newValue))}catch(_){}});try{apply(JSON.parse(localStorage.getItem(KEY)))}catch(_){}
</script></body></html>
